<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>traffic light system</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>a traffic light</h1>
    <p>Click the button or press R,Y, or G to change colors</p>

    <div id="trafficLight">
        <div id="red" class="light"></div>
        <div id="yellow" class="light"></div>
        <div id="green" class="light"></div>
    </div>

    <button onclick="changeLight()">Change Light</button>

    <p id="message">Don't move.</p>
    <p id="windowSize">Width of browser:</p>

    <script src="script.js"></script>

</body>
